<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <link href="./styles/output.css" rel="stylesheet">
</head>

<body>
    <h1 class="text-2xl text-fuchsia-800">Job Tracker</h1>
    <div class="flex items-center w-screen gap-10">
        <div id="applied" class="flex flex-col items-center gap-2 p-4 bg-blue-300 h-100 w-80">
            <div id="job-1" draggable="true" class="h-40 job w-70 bg-cyan-400">
                <h5>Job: Software developer</h5>
                <p>Company: TechStart</p>
            </div>
            <div id="job-2" draggable="true" class="h-40 job w-70 bg-cyan-400">
                <h5>Job: Software Engineer</h5>
                <p>Company: Enginocore</p>
            </div>
        </div>
        <div id="interviewed" class="flex flex-col items-center p-10 h-100 w-80 bg-fuchsia-300">

        </div>
    </div>


    <script src="./dist/app.js"></script>
</body>

</html>
