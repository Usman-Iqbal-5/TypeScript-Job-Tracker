<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>
    <link href="./styles/output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Playwrite+GB+S:ital,wght@0,100..400;1,100..400&display=swap"
        rel="stylesheet">
</head>

<body class="bg-slate-950 font-[Manrope] w-full">

    <header class="flex items-center justify-between w-full py-4 pl-5 pr-10 bg-slate-900">
        <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 fill-white"
                viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                <path
                    d="M96 160C96 142.3 110.3 128 128 128L512 128C529.7 128 544 142.3 544 160C544 177.7 529.7 192 512 192L128 192C110.3 192 96 177.7 96 160zM96 320C96 302.3 110.3 288 128 288L512 288C529.7 288 544 302.3 544 320C544 337.7 529.7 352 512 352L128 352C110.3 352 96 337.7 96 320zM544 480C544 497.7 529.7 512 512 512L128 512C110.3 512 96 497.7 96 480C96 462.3 110.3 448 128 448L512 448C529.7 448 544 462.3 544 480z" />
            </svg>
            <div>
                <h1 class="text-lg font-semibold text-white">Dashboard</h1>
                <p class="text-xs text-white font-extralight">Overview of your job applications</p>
            </div>
        </div>
        <button id="add-application-button"
            class="p-2 text-xs text-white bg-indigo-600 rounded-lg cursor-pointer hover:bg-indigo-800">
            &#43; Add Applicaiton
        </button>
    </header>

    <div id="dashboard-area" class="grid grid-cols-[1fr_auto] w-full">
        <main id="main-area" class="mt-5">
            <section class="flex justify-center w-full">
                <div id="kanban-board"
                    class="flex items-center min-w-fit w-10/12 gap-2 p-5 bg-[#F6F5F8] rounded-lg h-100">
                    <section id="applied-section"
                        class="flex-1 h-full border-t-4 rounded-lg shadow-[0_0_10px_rgba(0,0,0,0.15)] border-t-blue-500 bg-gray-100">
                        <div id="applied"
                            class="flex flex-col items-center h-full gap-2 p-2 overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-track]:bg-transparent">
                            <div class="flex items-center w-full gap-2 text-left">
                                <h2 class="font-bold">Applied</h2><span id="kanban-applied-number"
                                    class="text-sm text-center text-blue-500 bg-blue-100 rounded-full min-h-5 min-w-5"></span>
                            </div>
                        </div>
                    </section>
                    <section id="interview-section"
                        class="flex-1 h-full border border-t-4 rounded-lg shadow-[0_0_10px_rgba(0,0,0,0.15)] border-black/10 border-t-orange-500">
                        <div id="interviewed"
                            class="flex flex-col items-center h-full gap-2 p-2 overflow-y-auto  [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-track]:bg-transparent">
                            <div class="flex items-center w-full gap-2 text-left">
                                <h2 class="font-bold">Interview</h2><span id="kanban-interviewed-number"
                                    class="text-sm text-center text-orange-500 bg-orange-100 rounded-full min-h-5 min-w-5"></span>
                            </div>
                        </div>
                    </section>
                    <section id="offered-section"
                        class="flex-1 h-full border border-t-4 rounded-lg shadow-[0_0_10px_rgba(0,0,0,0.15)] border-black/10 border-t-green-500">
                        <div id="offered"
                            class="flex flex-col items-center h-full gap-2 p-2 overflow-y-auto [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-track]:bg-transparent">
                            <div class="flex items-center w-full gap-2 text-left">
                                <h2 class="font-bold">Offered</h2><span id="kanban-offered-number"
                                    class="text-sm text-center text-green-500 bg-green-100 rounded-full min-h-5 min-w-5"></span>
                            </div>
                        </div>
                    </section>
                    <section id="rejected-section"
                        class="flex-1 h-full border border-t-4 rounded-lg shadow-[0_0_10px_rgba(0,0,0,0.15)] border-black/10 border-t-red-500">
                        <div id="rejected"
                            class="flex flex-col items-center h-full gap-2 p-2 overflow-y-auto  [&::-webkit-scrollbar]:w-2 [&::-webkit-scrollbar-track]:bg-transparent">
                            <div class="flex items-center w-full gap-2 text-left">
                                <h2 class="font-bold">Rejected</h2><span id="kanban-rejected-number"
                                    class="text-sm text-center text-red-500 bg-red-100 rounded-full min-h-5 min-w-5"></span>
                            </div>
                        </div>
                    </section>
                </div>
            </section>
        </main>
        <aside id="job-side-area" class="w-[25vw] h-screen p-10 bg-white/5 border border-l-white/10 hidden">
            <div class="flex items-center justify-between">
                <h2 class="font-bold text-white">Job Title</h2>
                <button id="job-side-close-button" class="text-lg font-bold cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill-white font hover:fill-indigo-600"
                        viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                        <path
                            d="M183.1 137.4C170.6 124.9 150.3 124.9 137.8 137.4C125.3 149.9 125.3 170.2 137.8 182.7L275.2 320L137.9 457.4C125.4 469.9 125.4 490.2 137.9 502.7C150.4 515.2 170.7 515.2 183.2 502.7L320.5 365.3L457.9 502.6C470.4 515.1 490.7 515.1 503.2 502.6C515.7 490.1 515.7 469.8 503.2 457.3L365.8 320L503.1 182.6C515.6 170.1 515.6 149.8 503.1 137.3C490.6 124.8 470.3 124.8 457.8 137.3L320.5 274.7L183.1 137.4z" />
                    </svg>
                </button>
            </div>
        </aside>
    </div>

    <!--Modal-->
    <div id="modal-overlay" class="fixed inset-0 items-start justify-center hidden overflow-y-scroll bg-black/30">
        <div id="modal" class="w-1/2 p-5 my-10 bg-white rounded-lg max-w-1/2 min-h-4/5">
            <div id="modal-header" class="flex justify-between">
                <div>
                    <h3 class="text-sm font-bold capitalize caret-indigo-50">Add new application</h3>
                    <p class="text-xs font-normal text-gray-500">Fill in the details of the job application</p>
                </div>
                <button id="modal-close-button"
                    class="text-lg font-bold text-gray-400 bg-transparent cursor-pointer hover:text-indigo-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 fill font hover:fill-indigo-600"
                        viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                        <path
                            d="M183.1 137.4C170.6 124.9 150.3 124.9 137.8 137.4C125.3 149.9 125.3 170.2 137.8 182.7L275.2 320L137.9 457.4C125.4 469.9 125.4 490.2 137.9 502.7C150.4 515.2 170.7 515.2 183.2 502.7L320.5 365.3L457.9 502.6C470.4 515.1 490.7 515.1 503.2 502.6C515.7 490.1 515.7 469.8 503.2 457.3L365.8 320L503.1 182.6C515.6 170.1 515.6 149.8 503.1 137.3C490.6 124.8 470.3 124.8 457.8 137.3L320.5 274.7L183.1 137.4z" />
                    </svg>
                </button>
            </div>
            <form id="application-form" class="grid w-full grid-cols-2 mt-6 gap-x-10 gap-y-4">

                <div class="flex flex-col w-full">
                    <label class="text-xs" for="">Title <span class="text-red-600">*</span></label>
                    <input id="title"
                        class="p-2 text-xs border rounded-sm placeholder:text-gray-500 border-gray-950/30 focus:outline-indigo-600"
                        type="text" placeholder="Enter Title" required>
                </div>

                <div class="flex flex-col w-full">
                    <label class="text-xs" for="">Company <span class="text-red-600">*</span></label>
                    <input id="company"
                        class="p-2 text-xs border rounded-sm placeholder:text-gray-500 border-gray-950/30 focus:outline-indigo-600"
                        type="text" placeholder="Enter Company" required>
                </div>

                <div class="flex flex-col w-full">
                    <label class="text-xs" for="">Location <span class="text-red-600">*</span></label>
                    <input id="location"
                        class="p-2 text-xs border rounded-sm placeholder:text-gray-500 border-gray-950/30 focus:outline-indigo-600"
                        type="text" placeholder="Enter Location" required>
                </div>

                <div class="flex flex-col w-full">
                    <label class="text-xs" for="">Date Applied <span class="text-red-600">*</span></label>
                    <input id="data-applied"
                        class="p-2 text-xs text-gray-500 border rounded-sm border-gray-950/30 focus:outline-indigo-600"
                        type="date" required>
                </div>

                <div class="flex flex-col w-full">
                    <label class="text-xs" for="">URL <span class="text-red-600">*</span></label>
                    <input id="url"
                        class="p-2 text-xs border rounded-sm placeholder:text-gray-500 border-gray-950/30 focus:outline-indigo-600"
                        type="text" placeholder="Enter URL" required>
                </div>

                <div class="flex flex-col w-full">
                    <label class="text-xs" for="">Date interviewed (optional)</label>
                    <input id="date-interviewed"
                        class="p-2 text-xs text-gray-500 border rounded-sm border-gray-950/30 focus:outline-indigo-600"
                        type="date">
                </div>

                <div class="flex flex-col w-full">
                    <label class="text-xs" for="">Date Offered (optional)</label>
                    <input id="date-offered"
                        class="p-2 text-xs text-gray-500 border rounded-sm border-gray-950/30 focus:outline-indigo-600"
                        type="date">
                </div>

                <div class="flex flex-col w-full">
                    <label class="text-xs" for="">Date Rejected (optional)</label>
                    <input id="data-rejected"
                        class="p-2 text-xs text-gray-500 border rounded-sm border-gray-950/30 focus:outline-indigo-600"
                        type="date">
                </div>

                <div class="flex flex-col w-full">
                    <label class="text-xs" for="">Job Status</label>
                    <select id="job-status"
                        class="p-2 text-xs text-gray-500 border rounded-sm border-gray-950/30 focus:outline-indigo-600"
                        required>
                        <option value="applied">Applied</option>
                        <option value="interviewed">Interviewed</option>
                        <option value="offered">Offered</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>

                <div id="star-rating" class="text-4xl text-yellow-500 col-span-full">
                    <h4 class="text-xs text-black">
                        How well do your skills align with the job requirments? <span class="text-red-600">*</span>
                    </h4>
                    <span data-rating="1" class="cursor-pointer star">&star;</span>
                    <span data-rating="2" class="cursor-pointer star">&star;</span>
                    <span data-rating="3" class="cursor-pointer star">&star;</span>
                    <span data-rating="4" class="cursor-pointer star">&star;</span>
                    <span data-rating="5" class="cursor-pointer star">&star;</span>
                    <p id="message" class="text-[0.7rem] h-4 text-gray-600"></p>
                </div>

                <div class="flex flex-col w-full col-span-full">
                    <label class="text-xs text-black" for="notes">Notes (optional)</label>
                    <textarea
                        class="p-2 text-xs text-gray-500 border rounded-sm min-h-40 border-gray-950/30 focus:outline-indigo-600"
                        placeholder="Enter notes..." id="notes"></textarea>
                </div>

                <div id="button-container" class="flex justify-between col-span-full">
                    <button type="button" id="modal-close"
                        class="p-2 text-xs bg-white border rounded-lg cursor-pointer text-gray-950/30 border-grey-950/30 hover:bg-indigo-600 hover:text-white ">close</button>
                    <button type="submit" id="submit-application"
                        class="p-2 text-xs text-white bg-indigo-600 rounded-lg cursor-pointer hover:bg-indigo-800">Submit
                        Applicaiton
                    </button>
                </div>
            </form>
        </div>

    </div>
    <script type="module" src="./dist/app.js"></script>
</body>

</html>
